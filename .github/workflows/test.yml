# Type check and the full test suite on every push and pull request (the Pages workflow also tests before publishing main).
name: Tests
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
